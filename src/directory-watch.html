<script type="text/javascript">
    RED.nodes.registerType('directory-watch', {
        category: 'storage',
        color: 'burlywood',
        defaults: {
            name: { value: '' },
            source: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('sourceType');
                    return builtInValidator.call(this, v);
                },
            },
            sourceType: { value: 'str' },
            target: {
                value: 'file',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('targetType');
                    return builtInValidator.call(this, v);
                },
            },
            targetType: { value: 'msg' },
            depth: { value: 0 },
            watchAdd: { value: true },
            watchChange: { value: false },
            watchDelete: { value: false },
            filterFiles: { value: true },
            filterDirs: { value: false },
            awaitWriteFinish: { value: true },
            stabilityThreshold: { value: 2000 },
            ignoreInitial: { value: false },
            ignoredFiles: {
                value: '',
                validate: RED.validators.typedInput('ignoredFilesType'),
            },
            ignoredFilesType: { value: 're' },
        },

        inputs: 0,
        outputs: 1,

        icon: 'font-awesome/fa-eye',
        label: function () {
            return this.name || this.source || 'directory-watch';
        },

        oneditprepare: function () {
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-target').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-targetType'),
            });

            $('#node-input-ignoredFiles').typedInput({
                default: this.ignoredFilesType || 're',
                types: ['re'],
                typeField: $('#node-input-ignoredFilesType'),
            });

            $('#node-input-awaitWriteFinish')
                .on('change', function () {
                    if ($(this).is(':checked')) $('#row-stabilityThreshold').show();
                    else $('#row-stabilityThreshold').hide();
                })
                .trigger('change');
        },

        onsave: function () {
            this.ignoredFilesType = $('#node-input-ignoredFilesType').val();
        },
    });
</script>

<script type="text/markdown" data-help-name="directory-watch">
A node that watches a directory to detect added, changed, and deleted files or directories.

### Properties

- **Source Path** _string | flow | global | env | JSONata_ \
  Path of the directory to watch.

- **Output To** _msg | flow | global_ \
  The property where the complete watch event object will be stored. Defaults to `msg.file`.

- **Events** _checkboxes_ \
  Select which events will trigger a message: Add, Change, or Delete.

- **Types** _checkboxes_ \
  Filter events to only trigger for **Files**, **Directories**, or both.

    > **⚠️ Important:** Use `Add` for `Directories` with caution, as it will traverse the entire structure.
    >
    > Additionally, the event for adding directories is triggered _immediately_ when a folder is created, often before any files have actually been copied into it. The "Await write finish" feature only applies to individual files, not directories. If you are watching directories, you must handle the completion timing manually in your flow.

- **Ignore pattern** _regex_ \
  (Optional) Regex that matches file names to exclude (checks only the file name, not the full path).

- **Depth** _number_ \
  Depth of subdirectories to watch (0 for root only).

- **Await write finish** _boolean_ \
  Wait until the file size stabilizes before triggering an event (useful to prevent triggering on incomplete files).

- **Threshold** _number_ \
  Time in milliseconds to wait for file size stability.

- **On start ignore files in folder** _boolean_ \
  If enabled, existing files in the directory will be ignored when the node starts.

---

### Outputs

- **configured output property** _object_ \
  The object containing the event details. Defaults to `msg.file`.

  - **msg.file.action** _string_ \
    The event that triggered the node (`add`, `change`, or `delete`).

  - **msg.file.filetype** _string_ \
    The type of item that triggered the event (`file` or `directory`).

  - **msg.file.source** _string_ \
    The root directory configured for watching.

  - **msg.file.path** _string_ \
    The complete, normalized "absolute" path to the item.

  - **msg.file.dir** _string_ \
    The "absolute" path to the parent directory containing the item.

  - **msg.file.base** _string_ \
    The name of the file or directory _with_ the extension.

  - **msg.file.name** _string_ \
    The name of the file or directory _without_ the extension.

  - **msg.file.ext** _string_ \
    The file extension, including the dot.

  - **msg.file.stats** _object_ \
    The Node.js `fs.Stats` object for the file (will be `null` if unavailable).
</script>
