<script type="text/javascript">
    RED.nodes.registerType('directory-transfer', {
        category: 'storage',
        color: 'burlywood',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            action: {
                value: 'move',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    return !!v && v.trim() !== '';
                },
            },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;

                    var builtInValidator = RED.validators.typedInput('sourceType');
                    return builtInValidator.call(this, v);
                },
            },
            sourceType: { value: 'str' },
            destination: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;

                    var builtInValidator = RED.validators.typedInput('destinationType');
                    return builtInValidator.call(this, v);
                },
            },
            destinationType: { value: 'str' },
            recursive: { value: true },
        },

        inputs: 1,
        outputs: 1,

        icon: 'font-awesome/fa-exchange',
        label: function () {
            return (
                this.name ||
                (!this.dynamic ? (this.action + ' ' + this.source).trim() : 'directory-transfer')
            );
        },

        oneditprepare: function () {
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-destination').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-destinationType'),
            });

            var $action = $('#node-input-action');
            var $actionRadios = $('input[name="node-input-action-radio"]');

            $actionRadios.filter('[value="' + $action.val() + '"]').prop('checked', true);

            $actionRadios.on('change', function () {
                $action.val(this.value).trigger('change');
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#directory-options-group').hide();
                else $('#directory-options-group').show();
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="directory-transfer">
A node to move, rename, or copy directories on the file system.

### Properties

- **Load from msg.file** _boolean_ \
  If enabled, the node will ignore the UI properties and expect `msg.file.action`, `msg.file.source`, and `msg.file.destination` to be provided dynamically.

- **Action** _radio buttons_ \
  The operation to perform: Move / Rename or Copy.

- **Source Path** _string | msg | flow | global | env | JSONata_ \
  The absolute path to the directory you want to transfer.

- **Destination Path** _string | msg | flow | global | env | JSONata_ \
  The absolute path for the new location.

- **Create parent folder** _boolean_ \
  If enabled, missing parent directories in the destination path will be created automatically.

---

### Inputs

- **msg.file** _object_ \
  The incoming message triggers the operation.

  - **msg.file.action** _string_ \
    The action to execute if triggered dynamically (`move` or `copy`).

  - **msg.file.source** _string_ \
    The original absolute path to the directory.

  - **msg.file.destination** _string_ \
    The destination absolute path for the directory.

### Outputs

- **msg.file** _object_ \
  The object containing the event details.

  - **msg.file.filetype** _string_ \
    The type of item that triggered the event (`directory`).

  - **msg.file.action** _string_ \
    The action performed (`move` or `copy`).

  - **msg.file.source** _string_ \
    The normalized absolute path of the original directory.

  - **msg.file.destination** _string_ \
    The normalized absolute path of the destination.

  - **msg.file.path** _string_ \
    The normalized absolute path to the resulting directory (destination).

  - **msg.file.dir** _string_ \
    The "absolute" path to the parent directory of the resulting location.

  - **msg.file.base** _string_ \
    The name of the resulting directory.

  - **msg.file.name** _string_ \
    The name of the resulting directory.
</script>
