<script type="text/javascript">
    RED.nodes.registerType('directory-action', {
        category: 'storage',
        color: 'burlywood',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            action: {
                value: 'list',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    return !!v && v.trim() !== '';
                },
            },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;

                    var builtInValidator = RED.validators.typedInput('sourceType');
                    return builtInValidator.call(this, v);
                },
            },
            sourceType: { value: 'str' },
            property: { value: 'file.content' },
            propertyType: { value: 'msg' },
            recursive: { value: true },
        },

        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-folder-o',
        label: function () {
            return (
                this.name ||
                (!this.dynamic
                    ? (this.action + ' ' + (this.source || '')).trim()
                    : 'directory-action')
            );
        },

        oneditprepare: function () {
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-property').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-propertyType'),
            });

            var $action = $('#node-input-action');
            var $actionRadios = $('input[name="node-input-action-radio"]');

            $actionRadios.filter('[value="' + $action.val() + '"]').prop('checked', true);

            $actionRadios.on('change', function () {
                $action.val(this.value).trigger('change');
            });

            $('#node-input-action').on('change', function () {
                if ($(this).val() === 'create')
                    $('#row-create-parent label').html(
                        '<i class="fa fa-plus"></i> Create parent folder',
                    );

                if ($(this).val() === 'delete')
                    $('#row-create-parent label').html(
                        '<i class="fa fa-trash"></i> Delete recursive inner folders',
                    );

                if (
                    $(this).val() === 'create' ||
                    $(this).val() === 'delete' ||
                    $('#node-input-dynamic').prop('checked')
                )
                    $('#row-create-parent').show();
                else $('#row-create-parent').hide();
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#directory-options-group').hide();
                else $('#directory-options-group').show();

                $('#node-input-source').trigger('change');
                $('#node-input-action').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="directory-action">
A node to create, delete, or list the contents of directories on the file system.

### Properties

- **Output to** _msg | flow | global_ \
  The property where the action result is stored.
  - **Create / Delete**: `true` on success.
  - **List Contents**: the complete directory metadata object, including `contents`.

- **Load from msg.file** _boolean_ \
  If enabled, the node ignores the static Directory Options and reads `msg.file.action`, `msg.file.path`, and, for Create/Delete, `msg.file.recursive`.

- **Action** _radio buttons_ \
  The operation to perform: Create, Delete, or List Contents.

- **Source Path** _string | msg | flow | global | env | JSONata_ \
  The absolute path to the directory you want to operate on.

- **Recursive** _boolean_ \
  Controls recursive behavior for Create and Delete.
  - **Create**: creates missing parent directories when enabled.
  - **Delete**: removes contained files and subdirectories when enabled.
  - **List Contents**: not used.

---

### Inputs

- **msg.file** _object_ \
  The incoming message triggers the operation.

  - **msg.file.action** _string_ \
    The action to execute in dynamic mode (`create`, `delete`, or `list`).

  - **msg.file.path** _string_ \
    The directory path to operate on in dynamic mode.

  - **msg.file.recursive** _boolean_ \
    Controls recursive Create/Delete behavior in dynamic mode.

### Outputs

- **configured output property** _object | boolean_ \
  The value written to the configured **Output to** property.
  - **Create / Delete**: `true` on success.
  - **List Contents**: the directory metadata object described below, including `contents`.

- **directory metadata** _object_ \
  For **Create / Delete**, this metadata is merged into `msg.file`. \
  For **List Contents**, it is written to the configured output property.

  - **filetype** _string_ \
    The item type (`directory`).

  - **path** _string_ \
    The complete normalized path to the directory.

  - **dir** _string_ \
    The parent directory path.

  - **base** _string_ \
    The directory name.

  - **name** _string_ \
    The directory name without an extension.

  - **ext** _string_ \
    The parsed extension, normally empty for directories.

  - **contents** _array_ \
    Present for **List Contents** and contains the filenames and directory names inside the target directory.
</script>
