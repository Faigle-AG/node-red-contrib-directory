<script type="text/javascript">
    RED.nodes.registerType('directory-action', {
        category: 'storage',
        color: 'burlywood',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            action: {
                value: 'list',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    return !!v && v.trim() !== '';
                },
            },
            target: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;

                    var builtInValidator = RED.validators.typedInput('targetType');
                    return builtInValidator.call(this, v);
                },
            },
            targetType: { value: 'str' },
        },

        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-folder-o',
        label: function () {
            return (
                this.name ||
                (!this.dynamic ? (this.action + ' ' + this.target).trim() : 'directory-action')
            );
        },

        oneditprepare: function () {
            $('#node-input-target').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-targetType'),
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#file-options-group').hide();
                else $('#file-options-group').show();

                $('#node-input-target').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="directory-action">
A node to create, delete, or list the contents of directories on the file system.

### Properties

- **Load from msg.file** _boolean_ \
  If enabled, the node will ignore the UI properties and expect `msg.file.action` and `msg.file.path` to be provided dynamically.

- **Action** _dropdown_ \
  The operation to perform: Create, Delete, or List Contents.

- **Target** _string | msg_ \
  The absolute path to the directory you want to operate on.

---

### Inputs

- **msg.file** _object_ \
  The incoming message triggers the operation.

- **msg.file.action** _string_ \
  The action to execute if triggered dynamically (`create`, `delete`, or `list`).

- **msg.file.path** _string_ \
  The destination path of the directory.

### Outputs

- **msg.payload** _array | boolean_ \
    - **List**: Returns an array of strings representing the files and folders inside the target directory.
    - **Create / Delete**: Returns `true` on success.

- **msg.file** _object_ \
  The object containing the event details.

- **msg.file.filetype** _string_ \
  The type of item that triggered the event (`directory`).

- **msg.file.path** _string_ \
  The complete, normalized "absolute" path to the directory.

- **msg.file.dir** _string_ \
  The "absolute" path to the parent directory.

- **msg.file.base** _string_ \
  The name of the directory.

- **msg.file.name** _string_ \
  The name of the directory.

- **msg.file.contents** _array_ \
  An array containing the filenames inside the directory if the action was `List Contents`.
</script>
